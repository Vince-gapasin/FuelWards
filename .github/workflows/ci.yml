name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration and seed.sql on a fresh local Postgres, then runs pgTAP tests.
      - run: supabase start
      # Only our schema: PostGIS's own functions in `extensions` trip the linter.
      - run: supabase db lint --schema public --fail-on error
      - run: supabase test db
      # The committed types (npm run db:types) must match the migrations. The PostgREST version line
      # differs between the hosted and local generators, so it's ignored.
      - name: Check database types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff <(grep -v PostgrestVersion src/lib/database.types.ts) <(grep -v PostgrestVersion /tmp/database.types.ts)
      # Web end-to-end tests against the local Supabase above (never the hosted project).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the web app for the local Supabase
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
