name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration and seed.sql on a fresh local Postgres, then runs pgTAP tests.
      - run: supabase start
      # Only our schema: PostGIS's own functions in `extensions` trip the linter.
      - run: supabase db lint --schema public --fail-on error
      - run: supabase test db
      # Web end-to-end tests against the local Supabase above (never the hosted project).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the web app for the local Supabase
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      # The app must type-check against the schema the migrations produce, so a column or function
      # the app relies on can't be renamed or dropped unnoticed. (The generated text itself differs
      # between Supabase CLI versions, so the committed file isn't compared line by line.)
      - name: Type-check the app against the migrated schema
        if: success() || failure()
        run: |
          supabase gen types typescript --local --schema public > src/lib/database.types.ts
          npm run typecheck
